<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notebooks y accesorios</title>
    <link rel="stylesheet" href="../../css/estilos.css" />
  </head>
  <body>
    <header class="barra-superior">
      <h1>Notebooks y accesorios</h1>
      <nav class="menu">
        <a href="../../index.html">Inicio</a>
        <a href="../laboratorio/laboratorio.html">Laboratorio</a>
        <a href="../comedor/comedor.html">Comedor</a>
      </nav>
    </header>

    <main class="contenedor">
      <section class="panel">
        <p class="etiqueta">Grupo 4</p>
        <h2>Registro de equipos</h2>
        <p>
          Módulo para registrar notebooks, accesorios, estados y movimientos de
          gabinete.
        </p>

        <form class="formulario">
          <label>
            Código interno
            <input type="text" placeholder="NB-001" />
          </label>

          <label>
            Tipo
            <select>
              <option>Notebook</option>
              <option>Cargador</option>
              <option>Mouse</option>
              <option>Otro accesorio</option>
            </select>
          </label>

          <label>
            Marca
            <input type="text" placeholder="Marca" />
          </label>

          <label>
            Estado
            <select>
              <option>Disponible</option>
              <option>En uso</option>
              <option>En reparación</option>
              <option>Fuera de servicio</option>
            </select>
          </label>

          <label>
            Ubicación
            <input type="text" placeholder="Gabinete, aula, laboratorio" />
          </label>

          <div>
            <button type="button">Guardar</button>
          </div>
        </form>

        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Tipo</th>
              <th>Marca</th>
              <th>Estado</th>
              <th>Ubicación</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>NB-001</td>
              <td>Notebook</td>
              <td>Ejemplo</td>
              <td><span class="estado disponible">Disponible</span></td>
              <td>Gabinete</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
