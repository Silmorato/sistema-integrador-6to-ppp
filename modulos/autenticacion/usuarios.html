<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios y roles</title>
    <link rel="stylesheet" href="../../css/estilos.css" />
  </head>
  <body>
    <header class="barra-superior">
      <h1>Usuarios y roles</h1>
      <nav class="menu">
        <a href="../../index.html">Inicio</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <main class="contenedor">
      <section class="panel">
        <p class="etiqueta">Grupo 1</p>
        <h2>Gestión de usuarios</h2>
        <p>
          Esta pantalla puede usarse para simular usuarios, roles y permisos
          visuales del sistema.
        </p>

        <form class="formulario">
          <label>
            Nombre y apellido
            <input type="text" placeholder="Nombre del usuario" />
          </label>

          <label>
            Usuario
            <input type="text" placeholder="usuario" />
          </label>

          <label>
            Rol
            <select>
              <option>Administrador</option>
              <option>Directivo</option>
              <option>Docente</option>
              <option>Preceptor</option>
              <option>Alumno</option>
            </select>
          </label>

          <div>
            <button type="button">Guardar</button>
          </div>
        </form>

        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Usuario ejemplo</td>
              <td>admin</td>
              <td>Administrador</td>
              <td><span class="estado confirmado">Activo</span></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
