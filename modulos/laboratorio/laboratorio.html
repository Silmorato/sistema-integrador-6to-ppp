<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turnos de laboratorio</title>
    <link rel="stylesheet" href="../../css/estilos.css" />
  </head>
  <body>
    <header class="barra-superior">
      <h1>Laboratorio</h1>
      <nav class="menu">
        <a href="../../index.html">Inicio</a>
        <a href="../comedor/comedor.html">Comedor</a>
        <a href="../notebooks/notebooks.html">Notebooks</a>
      </nav>
    </header>

    <main class="contenedor">
      <section class="panel">
        <p class="etiqueta">Grupo 2</p>
        <h2>Turnos de laboratorio</h2>
        <p>
          Módulo para cargar, consultar y organizar turnos de laboratorio.
        </p>

        <form class="formulario">
          <label>
            Fecha
            <input type="date" />
          </label>

          <label>
            Hora
            <input type="time" />
          </label>

          <label>
            Profesor
            <input type="text" placeholder="Nombre del profesor" />
          </label>

          <label>
            Curso
            <input type="text" placeholder="Curso" />
          </label>

          <label>
            Laboratorio
            <select>
              <option>Laboratorio 1</option>
              <option>Laboratorio 2</option>
            </select>
          </label>

          <div>
            <button type="button">Guardar</button>
          </div>
        </form>

        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Profesor</th>
              <th>Curso</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>03/09/2026</td>
              <td>10:00</td>
              <td>Docente ejemplo</td>
              <td>6to</td>
              <td><span class="estado pendiente">Pendiente</span></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
