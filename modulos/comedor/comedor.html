<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservas de comedor</title>
    <link rel="stylesheet" href="../../css/estilos.css" />
  </head>
  <body>
    <header class="barra-superior">
      <h1>Comedor</h1>
      <nav class="menu">
        <a href="../../index.html">Inicio</a>
        <a href="../laboratorio/laboratorio.html">Laboratorio</a>
        <a href="../notebooks/notebooks.html">Notebooks</a>
      </nav>
    </header>

    <main class="contenedor">
      <section class="panel">
        <p class="etiqueta">Grupo 3</p>
        <h2>Reservas de comedor</h2>
        <p>
          Módulo para cargar y consultar reservas o turnos del comedor escolar.
        </p>

        <form class="formulario">
          <label>
            Fecha
            <input type="date" />
          </label>

          <label>
            Turno
            <select>
              <option>Desayuno</option>
              <option>Almuerzo</option>
              <option>Merienda</option>
            </select>
          </label>

          <label>
            Curso
            <input type="text" placeholder="Curso" />
          </label>

          <label>
            Cantidad de alumnos
            <input type="number" min="1" />
          </label>

          <label>
            Responsable
            <input type="text" placeholder="Nombre del responsable" />
          </label>

          <div>
            <button type="button">Guardar</button>
          </div>
        </form>

        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Turno</th>
              <th>Curso</th>
              <th>Cantidad</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>03/09/2026</td>
              <td>Almuerzo</td>
              <td>6to</td>
              <td>24</td>
              <td><span class="estado confirmado">Confirmado</span></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
